# ============================================================
# tools_config.yaml — 本地工具路径 + API Key 映射（Agent/脚本统一读取）
# ⚠️ 含敏感信息，.gitignore 已排除，勿提交；真实密钥放 .env / 环境变量
# ============================================================

paths:                                   # 本地软件执行路径（按各成员机器填写）
  python: "conda run -n huawei_mathmod python"
  latex: "C:/texlive/2026/bin/windows/xelatex.exe"      # LaTeX 编译
  originpro: "C:/Program Files/OriginLab/Origin2026/Origin.exe"  # 出版级图精修
  drawio: "C:/Program Files/draw.io/draw.io.exe"        # 架构图
  zotero: "C:/Program Files/Zotero/zotero.exe"          # 文献管理
  mathpix_cli: "C:/Program Files/Mathpix/mathpix.exe"

bib:
  zotero_export: "reference/literature/zotero_library.bib"  # 唯一引用真相源
  better_bibtex_auto_export: true

apis:                                    # API Key 占位（真实值走 .env）
  gurobi_license: "${GUROBI_LICENSE}"
  openai_api_key: "${OPENAI_API_KEY}"    # 仅 debug/润色
  anthropic_api_key: "${ANTHROPIC_API_KEY}"
  kimi_api_key: "${KIMI_API_KEY}"
  semantic_scholar_key: "${SEMANTIC_SCHOLAR_KEY}"
  hf_token: "${HF_TOKEN}"                # HuggingFace 模型下载

viz:                                     # 可视化规范（脚本自动读取，风格统一）
  palette: "NPG"                         # 学术色板：NPG / AAAS
  font_size_min: 8                       # 字号 ≥ 8pt
  format: "pdf"                          # 论文图统一导出矢量

# ------------------------------------------------------------
# 外部参考资料（只读引用，不复制进本仓库；路径按本机调整）
# 建模 skill 的 L0 schema 校验与理论查阅统一从这里解析
# ------------------------------------------------------------
references:
  modeling_design_theory: "../math_modeling/.agents/skills/modeling-analysis/references/建模设计理论.md"
  common_patterns: "../math_modeling/.agents/skills/modeling-analysis/references/常见模式.md"
  model_contract_schema: "../math_modeling/reference/schemas/model-contract.schema.json"

# ------------------------------------------------------------
# 评审模型隔离（严格质检用）
# 机制：评审走外部 LLM API 脚本（run_review.py），与作者异源；
#       脚本只读三件套，不携带作者思考过程/自检结果，天然无上下文污染。
#   author_model —— 撰写三件套的主建模模型（gpt5.6-sol，用户指定）
#   reviewers    —— 双独立评审（R1=deepseek v4 pro, R2=kimi k3）
#                   API Key 从 .env 读取，绝不硬编码。
# ⚠️ model 名为用户口语名称，请按各家官方 API 文档核对真实 model ID：
#    DeepSeek 通用 ID 常为 deepseek-chat；Moonshot 常为 moonshot-v1-*/kimi-k*。
# ------------------------------------------------------------
review:
  author_model: "gpt5.6-sol"            # 主建模模型（用户指定；请核对官方 model ID）
  isolation: "external-api"             # 隔离机制：外部 API 脚本评审，异源
  reviewers:
    R1:
      provider: "deepseek"
      model: "deepseek-v4-pro"          # 用户指定；请核对 DeepSeek 官方 API model ID
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
    R2:
      provider: "kimi"
      model: "kimi-k3"                  # 用户指定；请核对 Moonshot 官方 API model ID
      base_url: "https://api.moonshot.cn/v1"
      api_key_env: "KIMI_API_KEY"
